site_name: Centro Psicologico BI
site_description: Informe tecnico del pipeline CDC, data warehouse, dbt y BI del proyecto CentroPsicologico-BI.
site_author: Centro Psicologico BI
site_url: https://claudiob12.github.io/CentroPsicologico-BI/
repo_url: https://github.com/ClaudioB12/CentroPsicologico-BI
repo_name: ClaudioB12/CentroPsicologico-BI

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

nav:
  - Inicio: index.md
  - Informe tecnico: informe_tecnico.md
  - Diagramas:
      - Arquitectura CDC y BI: diagrams/arquitectura.md
      - Lineaje dbt: diagrams/lineaje_dbt.md
      - Esquema OLTP MySQL: diagrams/oltp_schema.md
      - Modelo dimensional: diagrams/modelo_dimensional.md
  - Evidencia pendiente: EVIDENCIA_PENDIENTE.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  generator: false
