site_name: Centro Psicologico BI
site_description: Solucion BI end-to-end para el Centro Psicologico Integral Guevara — MySQL, Debezium, Kafka, PostgreSQL, dbt y Power BI.
site_url: https://claudiob12.github.io/CentroPsicologico-BI/
site_author: Claudio Bustinza · Josue Ochoa · Joel Huillca · Wilbert Mayta
repo_url: https://github.com/ClaudioB12/CentroPsicologico-BI
repo_name: ClaudioB12/CentroPsicologico-BI

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

nav:
  - Inicio: index.md
  - Producto del Curso:
      - 1. Datos del Proyecto: informe/01_datos_generales.md
      - 2. Resumen Ejecutivo: informe/02_resumen_ejecutivo.md
      - 3. Problema y Objetivo Analitico: informe/03_problema_negocio.md
      - 4. KPIs Principales: informe/04_kpis.md
      - 5. Arquitectura BI: informe/05_arquitectura.md
      - 6. Fuente Transaccional OLTP: informe/06_oltp.md
      - 7. Pipeline de Ingesta y Transformacion: informe/07_pipeline.md
      - 8. Data Warehouse y DataMart: informe/08_datamart.md
      - 9. Modelo Semantico Power BI: informe/09_modelo_semantico.md
      - 10. Dashboard Interactivo: informe/10_dashboard.md
      - 15. Sustentacion Tecnica: informe/15_sustentacion.md
  - Diagramas:
      - Arquitectura CDC y BI: diagrams/arquitectura.md
      - Lineaje dbt: diagrams/lineaje_dbt.md
      - Esquema OLTP MySQL: diagrams/oltp_schema.md
      - Modelo Dimensional: diagrams/modelo_dimensional.md
  - Evidencias: EVIDENCIA_PENDIENTE.md
  - Informe tecnico: informe_tecnico.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  generator: false
