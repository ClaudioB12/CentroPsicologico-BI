version: '3.9'

# ═══════════════════════════════════════════════════════════════════
#  CONTENEDOR POSTGRES — Pipeline CDC + dbt (destino BI)
#
#  REQUISITO: el contenedor mysql/ debe estar corriendo primero.
#             (crea la red cdc_network que este archivo usa)
#
#  FLUJO:
#  PostgreSQL raw ◄── Kafka Connect ◄── Kafka ◄── Debezium ◄── MySQL
#       │
#     dbt run
#       │
#  PostgreSQL datamart
#
#  INICIAR:   docker compose up -d
#  DETENER:   docker compose down
#  RESET:     docker compose down -v
#
#  PUERTOS:
#    5432  → PostgreSQL
#    9092  → Kafka
#    8083  → Kafka Connect
#    8080  → Kafka UI
#    5050  → pgAdmin
# ═══════════════════════════════════════════════════════════════════

services:

  # ── DESTINO — PostgreSQL (raw + datamart) ───────────────────────
  postgres:
    image: postgres:15
    container_name: centro_psicologico_postgres
    environment:
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dm_centro_psicologico
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      cdc_network:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── INFRAESTRUCTURA — Zookeeper ──────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - cdc_network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 /usr/bin/zookeeper-shell localhost:2181 ls / 2>&1 | grep -q zookeeper"]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 15s

  # ── BROKER — Kafka ───────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - cdc_network
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── CDC — Kafka Connect (Debezium source + JDBC sink) ────────────
  kafka-connect:
    build: ./kafka-connect
    container_name: kafka_connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: centro-connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: _connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    volumes:
      - ./connectors:/connectors
    networks:
      - cdc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # ── REGISTRO AUTOMÁTICO DE CONECTORES ───────────────────────────
  connector-init:
    image: curlimages/curl:latest
    container_name: connector_init
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./connectors:/connectors
      - ./scripts:/scripts
    command: ["/bin/sh", "/scripts/register-connectors.sh"]
    networks:
      - cdc_network
    restart: "no"

  # ── TRANSFORMACIÓN — dbt ─────────────────────────────────────────
  dbt:
    build: ./dbt
    container_name: centro_psicologico_dbt
    depends_on:
      postgres:
        condition: service_healthy
      connector-init:
        condition: service_completed_successfully
    volumes:
      - ./dbt:/dbt
    networks:
      - cdc_network
    restart: "no"

  # ── MONITOREO — Kafka UI ─────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: CentroPsicologico-CDC
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    networks:
      - cdc_network

  # ── MONITOREO — pgAdmin ──────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    depends_on:
      - postgres
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@centro.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - cdc_network

volumes:
  postgres_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  pgadmin_data:

networks:
  cdc_network:
    external: true
    name: cdc_network
